name = "obsidianrayder"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "obsidianrayder-gallery"
# Create the bucket in the new Cloudflare account before deploying.
